<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80" viewBox="0 0 320 80">
  <defs>
    <linearGradient id="notebookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE9E9E"/>
      <stop offset="100%" stop-color="#BC898E"/>
    </linearGradient>
  </defs>

  <rect width="320" height="80" rx="18" fill="url(#notebookGrad)"/>

  <!-- Notebook icon -->
  <rect x="30" y="23" width="26" height="34" rx="3" fill="white"/>
  <line x1="36" y1="32" x2="50" y2="32" stroke="#BC898E" stroke-width="2"/>
  <line x1="36" y1="40" x2="50" y2="40" stroke="#BC898E" stroke-width="2"/>
  <line x1="36" y1="48" x2="50" y2="48" stroke="#BC898E" stroke-width="2"/>

  <text x="80" y="50"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="24"
        font-weight="700"
        fill="white">
    View Notebook
  </text>
</svg>